sources:
- title: Arithmetic control of Wigner-Dyson symmetry classes in kicked Kloosterman maps
  authors:
  - Brandon Yates
  id: https://doi.org/10.5281/zenodo.20771210
  location: Zenodo preprint, deposited 2026-06-20, CC BY 4.0 (concept DOI 10.5281/zenodo.20771209;
    file kicked_kloosterman_v6.pdf)
  type: paper
  relationship: formalizes
  note: 'The author''s openly deposited preprint, and the source of two of the eight compared
    theorems. Record metadata -- title, creator, date 2026-06-20, open access, resource type
    preprint, CC BY 4.0, concept DOI, single file kicked_kloosterman_v6.pdf -- was verified
    against the Zenodo API for this entry, and the deposited source text was read directly.
    WHAT IS COMPARED FROM IT: Corollary cor:monomial ("Parity of a monomial kick selects the
    class") is formalized as monomial_reflection_iff'', and Corollary cor:nosymplectic ("Exclusion
    of the symplectic class") as no_antiunitary_sq_neg_one. Both are formalized with hypotheses
    dropped: cor:monomial is stated in the preprint for a prime field with p > d and the formalization
    holds for every exponent d, and cor:nosymplectic is stated there for a unitary W on l^2(F_p)
    with p > 3 while the formalization holds for an arbitrary complex matrix over any finite
    index type of odd cardinality. The preprint''s proof of cor:monomial states that "The
    hypothesis p > d is necessary"; the formalized theorem shows that the reflection criterion
    holds without it, and that discrepancy is recorded in full under fidelity rather than
    passed over. SCOPE OF WHAT IS COMPARED: only the reflection-criterion equivalence of cor:monomial
    and only the "no antiunitary squares to -I in odd dimension" clause of cor:nosymplectic
    are formalized. The symmetry-class assignments those corollaries go on to make -- that
    even-degree kicks lie in the orthogonal class and odd-degree kicks in the unitary class,
    and that the construction realizes the orthogonal and unitary classes but never the symplectic
    one -- rest in the preprint on Theorem thm:criterion together with reported numerics,
    are NOT formalized here, and are not claimed anywhere in this entry. WHAT IS NOT IN IT:
    the six first-moment theorems. The deposited source contains no label prop:firstmoment,
    eq:firstmoment, eq:tracefact or eq:circulant and no occurrence of the phrase "first moment"
    (each searched, zero hits); it reports |Tr U^k|^2 only as a binned numerical spectral
    form factor, with no exact evaluation of the kick-strength average at k = 1. Note also
    a notational collision for any reader diffing the two: the preprint''s varphi is the semicircle
    characteristic function J_1(2u)/u appearing in its asymptotic analysis, whereas the Lean
    varphi is the exact finite-p average p^{-1} sum_a exp(-i s K(a;p)); they are different
    objects and no asymptotic relation between them is claimed here. The preprint''s Tr denotes
    the field trace F_q -> F_p, not the matrix trace.'
