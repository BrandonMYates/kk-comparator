version: v0.4
project:
  name: Exact trace identities for the kicked Kloosterman map
  description: 'This project formalizes in Lean 4 eight exact identities for the kicked Kloosterman
    map, a quantized map on the finite phase space F_p. Two of the eight are corollaries of
    the author''s openly deposited preprint (doi:10.5281/zenodo.20771210), formalized in strictly
    stronger form than the preprint states them; the other six are exact first-moment statements
    taken from the author''s unpublished post-submission revision of the same manuscript,
    and they do not appear in the deposited preprint at all. The map''s free generator is
    the Kloosterman Hamiltonian K_p = sum_{x != 0} psi(x^{-1}) T_x acting on l^2(F_p), where
    psi is a nontrivial additive character of F_p and T_x is translation by x; in the additive-character
    basis K_p is diagonal with eigenvalues the Kloosterman sums K(a;p) = sum_{x != 0} psi(a
    x + x^{-1}). The free propagator is U_{0,tau} = exp(-i tau K_p / sqrt p), and the kicked
    propagator is U_{f,tau} = D_f U_{0,tau} with D_f the diagonal phase D_f |x> = psi(f(x))
    |x>.


    Six of the eight compared theorems are the exact first-moment package. trace_floquet factors
    the trace, Tr U_{f,tau} = phi_p(tau) sum_x psi(f(x)), where phi_p(tau) is the common diagonal
    entry of the free propagator; the kick enters only through a complete character sum and
    the free step only through one scalar. firstMoment and firstMoment_expectation then evaluate
    the average of |Tr U_{gamma g,tau}|^2 over the kick strength gamma in F_p^x exactly, as
    |phi_p(tau)|^2 (p N_g - p^2)/(p - 1), where N_g = #{(x,y) : g(x) = g(y)} is the fiber
    count of the kick function: the average depends on the kick only through that count. firstMoment_sq,
    firstMoment_cube_one_mod_three and firstMoment_cube_two_mod_three are the three arithmetic
    instantiations -- p |phi_p(tau)|^2 for the quadratic kick at every odd prime, 2p |phi_p(tau)|^2
    for the cubic kick when p = 1 mod 3, and exactly zero for the cubic kick when p = 2 mod
    3, the last because cubing is then a bijection of F_p and the complete character sum vanishes
    identically.


    The remaining two theorems are corollaries of the manuscript''s affine-reflection classification,
    each compared in a strictly stronger form than the manuscript states, with the strengthening
    declared rather than absorbed. monomial_reflection_iff'' says that over a prime field
    of odd characteristic a monomial kick gamma x^d with gamma nonzero admits an affine reflection
    centre -- a beta with gamma x^d = gamma (beta - x)^d for every x -- if and only if d is
    even; the manuscript carries the hypothesis p > d, and it is dropped here, the statement
    holding for every natural exponent d including d >= p, because the argument evaluates
    at x = 0 and x = 1 and never mentions the degree of a polynomial. no_antiunitary_sq_neg_one
    says that in odd dimension no antiunitary squares to -I, where an antiunitary is written
    in the standard form Theta = W . C with C entrywise complex conjugation, so Theta^2 =
    W conj(W); the manuscript assumes W unitary and never uses it, so the theorem is proved
    here for an arbitrary complex matrix over an arbitrary index type of odd cardinality.


    Scope, stated plainly. Every compared statement is an exact identity at a fixed finite
    prime. NOT CLAIMED anywhere in this entry, its Challenge, or its supporting library: any
    random-matrix, Wigner-Dyson, Sato-Tate, equidistribution or spectral-statistics statement;
    any level-spacing law, gap-ratio statistic, spectral form factor, or symmetry-class assignment;
    any asymptotic statement in p or in tau, and any error term. no_antiunitary_sq_neg_one
    excludes one algebraic possibility and asserts nothing about which symmetry class, if
    any, is realized. The Weil bound |K(a;p)| <= 2 sqrt p is not used, and neither is any
    etale-cohomological input; the source manuscript''s numerical sections are not formalized
    and nothing here depends on them. The cubic vanishing theorem carries the hypothesis p
    = 2 mod 3 exactly as the source states it, so p = 3 is outside the compared statement.


    Definitions. Mathlib has no Kloosterman sums: a case-insensitive grep for "kloosterman"
    across Mathlib at revision 81a5d257c8e410db227a6665ed08f64fea08e997 (tag v4.32.0) returns
    zero hits, checked for this entry. The Challenge therefore defines kloostermanSum and
    kloostermanMatrix inline from Mathlib''s AddChar primitives, together with the five further
    definitions the compared statements need (phaseMat, freeProp, varphi, floquet, fiberCount);
    each carries a docstring giving its ordinary mathematical meaning, and the Solution restates
    every one of them verbatim with a definitional-equality bridge to the library.


    Audience. First, arithmetic quantum chaos and the quantization of maps on finite phase
    spaces: the construction sits directly against the quantized-cat-map programme (Kurlberg
    and Rudnick, Duke Math. J. 103 (2000), no. 1, doi:10.1215/S0012-7094-00-10314-6) and the
    kicked-map symmetry-class literature for which Dyson''s threefold way (J. Math. Phys.
    3 (1962), 1199-1215) supplies the classification vocabulary. What the compared theorems
    give that community is a family of quantized maps whose one- and two-point trace data
    are exactly computable at finite p, with the value controlled by a purely arithmetic invariant
    of the kick (its fiber count), and an exact vanishing in a fixed residue class. Second,
    the exponential-sums and trace-functions community that studies Kloosterman sums themselves
    (Kloosterman, Acta Math. 49 (1926), 407-464; Weil, Proc. Nat. Acad. Sci. U.S.A. 34 (1948),
    204-207; Katz, Gauss Sums, Kloosterman Sums, and Monodromy Groups, Princeton, 1988): the
    identities are statements about complete sums of Kloosterman phases, and interest in exactly
    this interface is current -- see arXiv:2601.01603 (Matrix Kloosterman Sums, Random Matrix
    Statistics, and Cryptography, January 2026), which is independent work on the same keyword
    pair and is cited here only to identify the readership. Third, the formalization community:
    because Mathlib has no Kloosterman sums at all, this entry is coverage-creating rather
    than coverage-duplicating -- it puts a Kloosterman sum, a Kloosterman Hamiltonian and
    their spectral resolution into Lean, and the supporting library proves the diagonalization
    of K_p by the finite Fourier transform, the circulant form of the free propagator, and
    the fiber-count formula N_{x^n} = 1 + (p - 1) gcd(p - 1, n) as reusable results.


    Provenance, stated plainly. The two corollaries are formalizations of Corollary cor:monomial
    and Corollary cor:nosymplectic of the deposited preprint, with hypotheses dropped in each
    case (p > d, and unitarity together with the restriction to a prime field of odd order);
    the preprint''s proof of cor:monomial asserts that its hypothesis p > d "is necessary",
    and the formalized theorem shows that it is not, which is recorded as a material finding
    under fidelity. The six first-moment statements come from the author''s unpublished, uncirculated
    post-submission revision; per the registry''s rule on unconfirmable sources, that revision
    establishes nothing about novelty, priority or reception, and no such claim is made --
    the statements are simply recorded here as absent from the deposited preprint, which was
    checked by searching the deposited source for each of its labels and for the phrase "first
    moment" (zero occurrences). No claim of novelty against the wider literature is made anywhere
    in this entry. What is asserted, and checked, is that Mathlib contains no Kloosterman
    content (grepped, above). A search for prior formalizations of Kloosterman sums or of
    quantized maps on finite phase spaces was targeted, not exhaustive; absence from search
    is not proof that none exists.'
