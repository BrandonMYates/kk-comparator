alignment:
  namespace: KickedKloosterman
  statements:
  - source: Unpublished revision (not in the preprint), prop:firstmoment, eq:tracefact
    lean: KickedKloosterman.trace_floquet
    status: proved
    note: Tr U_{f,tau} = phi_p(tau) sum_x psi(f(x)), as the trace of phaseMat * freeProp summed over ZMod p.
  - source: Unpublished revision (not in the preprint), prop:firstmoment, eq:firstmoment
    lean: KickedKloosterman.firstMoment
    status: proved
    note: Sum over nonzero gamma of |Tr U_{gamma g,tau}|^2 = |phi_p(tau)|^2 (p N_g - p^2), the count cast to
      R.
  - source: Unpublished revision (not in the preprint), prop:firstmoment, normalized form
    lean: KickedKloosterman.firstMoment_expectation
    status: proved
    note: The expectation over gamma uniform on F_p^x, written as (p - 1)^{-1} times that finite sum.
  - source: Unpublished revision (not in the preprint), prop:firstmoment, quadratic case
    lean: KickedKloosterman.firstMoment_sq
    status: proved
    note: N_{x^2} = 2p - 1 gives p |phi_p(tau)|^2. p != 2 is carried and necessary; there squaring is bijective.
  - source: Unpublished revision (not in the preprint), prop:firstmoment, cubic case p = 1 mod 3
    lean: KickedKloosterman.firstMoment_cube_one_mod_three
    status: proved
    note: N_{x^3} = 3p - 2 gives 2p |phi_p(tau)|^2. The residue hypothesis is genuine; the other class differs.
  - source: Unpublished revision (not in the preprint), prop:firstmoment, cubic case p = 2 mod 3
    lean: KickedKloosterman.firstMoment_cube_two_mod_three
    status: proved
    note: Exactly zero, at every such prime and every parameter. p = 3 is outside it; nothing is claimed there.
  - source: Deposited preprint, Corollary cor:monomial; strengthened, the hypothesis p > d dropped
    lean: KickedKloosterman.monomial_reflection_iff'
    status: proved
    note: Holds for every exponent d, strictly stronger. Only the reflection criterion; no class assignment.
  - source: Deposited preprint, Corollary cor:nosymplectic; strengthened, unitarity of W dropped
    lean: KickedKloosterman.no_antiunitary_sq_neg_one
    status: proved
    note: Arbitrary complex matrix over a finite type of odd cardinality, strictly stronger. Only that clause.
