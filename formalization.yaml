status:
  scope: 'PROVED: the eight compared theorems under exactly the hypotheses shown (nontriviality of the additive
    character; p != 2 for the quadratic instantiation and the monomial criterion; p = 1 mod 3 and p = 2 mod
    3 for the cubic ones). NOT PROVED and NOT CLAIMED: any random-matrix, Wigner-Dyson, Sato-Tate, equidistribution
    or spectral-statistics statement; any level-spacing, gap-ratio or spectral-form-factor result; any asymptotic
    in p or tau; any higher moment; the affine-reflection criterion itself, only two of whose corollaries are
    compared; and every other result of the preprint or the revision.'
