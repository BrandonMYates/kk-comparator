      spend_usd: subscription-based
      hardware: local Apple Silicon machine
    prompting_notes: 'Three items on record. (1) The deposited preprint''s cor:monomial carries
      the hypothesis p > d, used there to identify a polynomial with the function it induces;
      during construction it was found to be unnecessary, and monomial_reflection_iff'' proves
      the criterion for every exponent d by evaluating at x = 0 and x = 1, with no degree
      argument; the preprint''s proof asserts the opposite, and that is recorded under fidelity.
      The preprint''s own statement is retained separately in the library, with d < p carried
      and unused. (2) The preprint''s cor:nosymplectic assumes the matrix W is unitary; unitarity
      is never used by the determinant argument, so no_antiunitary_sq_neg_one is proved for
      an arbitrary complex matrix, and the preprint''s phrasing is derived from it. Both drops
      are declared in the Challenge docstrings rather than absorbed silently. (3) An observation
      recorded but deliberately NOT built into the compared statement: the unpublished revision''s
      "for p = 2 mod 3 the cube map is a bijection" understates, because at p = 3 the cube
      map is the Frobenius, hence the identity, hence also bijective, so the fiber-count lemma
      generalizes to p != 1 mod 3 with the same proof. The compared theorem keeps the source''s
      hypothesis p = 2 mod 3 exactly as written, and therefore says nothing at p = 3. Separately,
      the hypothesis that the additive character is nontrivial was confirmed to be load-carrying
      rather than defensive by computing the failures at the trivial character, and p != 2
      in the quadratic fiber count was confirmed necessary by decision procedure at p = 2.'
