fidelity:
  divergences: 'MATERIAL FINDING against the cited source. The deposited preprint (10.5281/zenodo.20771210)
    states Corollary cor:monomial for a prime field with p > d, and its proof ends with the
    sentence, quoted verbatim: "The hypothesis $p > d$ is necessary: when $p \mid d$ the monomial
    induces a function of lower degree, the case recorded for the cubic in characteristic
    three below." The compared theorem monomial_reflection_iff'' shows that it is not necessary:
    the equivalence between the existence of an affine reflection centre and the evenness
    of d holds over every prime field of odd characteristic for every exponent d, including
    d >= p, and the Lean proof never mentions the degree of a polynomial -- it evaluates the
    identity at x = 0 to force the centre to be 0, then at x = 1 to force 2 = 0. The preprint''s
    observation that a monomial with p | d induces a function of lower degree is correct;
    what does not follow, and what the formalization refutes, is that the criterion needs
    p > d. The compared statement is therefore strictly stronger than the source it formalizes,
    and the source is wrong on this point. A second, smaller strengthening: cor:nosymplectic
    is stated in the preprint for a unitary W on l^2(F_p) with p > 3, and the compared theorem
    drops both unitarity (never used by the determinant argument) and the restriction to a
    prime field, holding for an arbitrary complex matrix over any finite index type of odd
    cardinality. Both strengthenings are declared in the Challenge docstrings rather than
    absorbed silently. SCOPE OF THE TWO COROLLARIES: only the reflection-criterion equivalence
    of cor:monomial and only the odd-dimension exclusion clause of cor:nosymplectic are formalized;
    the symmetry-class assignments those corollaries also make rest in the preprint partly
    on reported numerics and are neither formalized nor claimed here. NOTATION: the preprint''s
    varphi is the semicircle characteristic function J_1(2u)/u of its asymptotic analysis,
    while the Lean varphi is the exact finite-p average p^{-1} sum_a exp(-i s K(a;p)); these
    are different objects and no relation between them is claimed. The preprint''s Tr is the
    field trace F_q -> F_p, not the matrix trace. The manuscript''s parameter combination
    tau/sqrt(p) is carried by a single real parameter in every Lean statement, which is universally
    quantified, so the Lean statements cover every tau. The manuscript writes the free propagator
    as (U_{0,tau})_{xy} = u(y - x); the Lean definition uses Mathlib''s circulant convention,
    and only the diagonal entry u(0) is consumed, which is the same under either orientation.
    Antiunitary operators are modelled in the standard form Theta = W . C with C entrywise
    complex conjugation in the position basis, so that Theta^2 = W conj(W); this is a modelling
    choice, stated in the Challenge docstring, not a weakening. The uniform average over the
    nonzero kick strengths is written as an explicit finite sum divided by p - 1; no probability
    space is involved and none is claimed. Two compared theorems are strictly stronger than
    the manuscript statements they replace, each declared in its docstring: monomial_reflection_iff''
    drops the hypothesis p > d, and no_antiunitary_sq_neg_one drops unitarity of W. One deliberate
    non-generalization: firstMoment_cube_two_mod_three carries the source''s hypothesis p
    = 2 mod 3, so p = 3 is outside the compared statement even though the underlying fiber
    count also holds there. No other known divergence.'
