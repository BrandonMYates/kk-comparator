    against frozen lemma contracts. Verification: mechanical, plus an independent pass by a separate agent
    (claude-fable-5). Communication: agent-drafted, reviewed by the author.'
fidelity:
  divergences: 'MATERIAL FINDING. The preprint states cor:monomial with p > d and its proof asserts verbatim
    that "The hypothesis $p > d$ is necessary"; the compared theorem shows it is not, the equivalence between
    an affine reflection centre and evenness of d holding for every exponent d, the proof evaluating at x =
    0 and x = 1, never at a degree. Smaller: cor:nosymplectic drops unitarity of W and the prime-field restriction,
    both declared in the docstrings. PARTIAL COROLLARIES: only the reflection criterion and the odd-dimension
    exclusion clause are formalized, not the class assignments those corollaries also make. firstMoment_cube_two_mod_three
    keeps the source''s p = 2 mod 3, so p = 3 lies outside it.'
