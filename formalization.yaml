      spend_usd: subscription-based
      hardware: local Apple Silicon machine
    prompting_notes: 'Findings. (1) The preprint''s cor:monomial carries p > d; it was found unnecessary, and
      monomial_reflection_iff'' proves the criterion for every exponent with no degree argument, the preprint
      asserting the opposite (recorded under fidelity). (2) cor:nosymplectic assumes W unitary; unitarity is
      never used, so the theorem is proved for an arbitrary complex matrix. (3) Recorded but deliberately NOT
      built into the compared statement: at p = 3 the cube map is the Frobenius, so the fiber-count lemma extends
      to p != 1 mod 3, yet the theorem keeps the source''s p = 2 mod 3. (4) Nontriviality of the character,
      and p != 2 in the quadratic count, were each confirmed necessary by direct computation.'
  spend_usd: subscription-based
