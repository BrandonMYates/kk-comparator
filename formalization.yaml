    real parameter, under exactly the hypotheses shown in their statements (nontriviality
    of the additive character; p != 2 for the quadratic instantiation and for the monomial
    criterion; p = 1 mod 3 and p = 2 mod 3 for the two cubic instantiations). NOT PROVED and
    NOT CLAIMED: any random-matrix, Wigner-Dyson, Sato-Tate, equidistribution or spectral-statistics
    statement; any level-spacing, gap-ratio or spectral-form-factor result; any asymptotic
    in p or tau; any second- or higher-moment identity; the affine-reflection criterion itself
