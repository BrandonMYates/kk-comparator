version: v0.4
project:
  name: Exact trace identities for the kicked Kloosterman map
  description: 'Formalizes in Lean 4 eight exact identities for the kicked Kloosterman map, a quantized map
    on the finite phase space F_p. The free generator is the Kloosterman Hamiltonian K_p = sum_{x != 0} psi(x^{-1})
    T_x on l^2(F_p), diagonal in the additive-character basis with eigenvalues the Kloosterman sums K(a;p);
    the propagators are U_{0,tau} = exp(-i tau K_p / sqrt p) and U_{f,tau} = D_f U_{0,tau} with D_f |x> = psi(f(x))
    |x>. Six of the eight are the exact first-moment package: trace_floquet factors Tr U_{f,tau} = phi_p(tau)
    sum_x psi(f(x)); firstMoment and firstMoment_expectation evaluate the average of |Tr U_{gamma g,tau}|^2
    over the kick strength gamma in F_p^x exactly as |phi_p(tau)|^2 (p N_g - p^2)/(p - 1), where N_g = #{(x,y)
    : g(x) = g(y)}, so the average sees the kick only through that fiber count; and three instantiations give
    p |phi_p(tau)|^2 for the quadratic kick, 2p |phi_p(tau)|^2 for the cubic kick at p = 1 mod 3, and exactly
    zero at p = 2 mod 3, cubing being a bijection there. The remaining two are corollaries of the affine-reflection
    classification: a monomial kick gamma x^d over a prime field of odd characteristic admits an affine reflection
    centre if and only if d is even, and in odd dimension no antiunitary squares to -I.


    SCOPE. Every compared statement is an exact identity at a fixed prime. NOT CLAIMED anywhere: any random-matrix,
    Wigner-Dyson, Sato-Tate, equidistribution or spectral-statistics statement; any level-spacing, gap-ratio
    or spectral-form-factor statistic; any symmetry-class assignment; any asymptotic in p or tau, and any error
    term. The Weil bound and etale-cohomological input are unused; the manuscript''s numerics are not formalized.
    Mathlib has no Kloosterman sums, so the Challenge defines seven objects inline.


    PROVENANCE. Two compared theorems are corollaries of the author''s openly deposited preprint, each formalized
    in strictly stronger form; the other six come from his unpublished, uncirculated post-submission revision
    and are absent from that preprint. Per the registry''s rule an unconfirmable source establishes nothing
    about novelty or priority, and no claim of novelty against the wider literature is made anywhere in this
    entry.


    AUDIENCE. Arithmetic quantum chaos and the quantization of maps on finite phase spaces, the exponential-sums
    community, and the formalization community, for which the entry is coverage-creating.'
  authors:
  - Brandon Yates
  license: Apache-2.0
  responsible_maintainers:
  - Brandon Yates
